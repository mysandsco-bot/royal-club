<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Club — Demo Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#070403;
  --bg2:#120a05;
  --panel:#160d06;
  --panel2:#1e1207;
  --gold:#f2c14e;
  --gold-hi:#ffe9a8;
  --gold-lo:#8a5a12;
  --gold-line:rgba(242,193,78,.45);
  --gold-soft:rgba(242,193,78,.12);
  --red:#c8102e;
  --red-deep:#6e0716;
  --cream:#f7edd8;
  --muted:#b89d6f;
  --win:#6fe09a;
  --shadow:0 12px 40px rgba(0,0,0,.6);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;
  color:var(--cream);
  font-family:"Manrope","Rajdhani",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(60% 45% at 78% 18%, rgba(200,16,46,.20), transparent 65%),
    radial-gradient(55% 40% at 18% 8%,  rgba(242,193,78,.14), transparent 60%),
    radial-gradient(70% 60% at 50% 110%, rgba(120,60,10,.25), transparent 60%),
    linear-gradient(180deg,#140b05 0%, var(--bg) 45%, #050302 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
::selection{background:var(--gold);color:#241500}
.goldtext{
  background:linear-gradient(180deg,#fff6cf 5%,#ffd76a 38%,#f2c14e 55%,#a06a12 78%,#ffd76a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.mono{font-variant-numeric:tabular-nums}

/* floating gold dust */
.dust{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle,#ffe9a8,#f2c14e 60%,transparent);
  opacity:0;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) scale(.6);opacity:0}
  12%{opacity:.85}
  100%{transform:translateY(-105vh) scale(1.15);opacity:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px clamp(10px,2.5vw,26px);
  background:linear-gradient(180deg,rgba(10,5,2,.95),rgba(10,5,2,.78));
  border-bottom:1px solid var(--gold-line);
  backdrop-filter:blur(8px);
}
.player{display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;
  background:radial-gradient(circle at 35% 28%,#3a2410,#170c04);
  border:2px solid var(--gold);box-shadow:0 0 12px rgba(242,193,78,.35)}
.player .who{line-height:1.15}
.player .hello{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.player .name{font-weight:800;font-size:15px;letter-spacing:.5px}
.viprow{display:flex;align-items:center;gap:6px;margin-top:3px}
.vipchip{font-size:10px;font-weight:800;padding:1.5px 8px;border-radius:999px;color:#2a1700;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));border:1px solid var(--gold-lo)}
.xpbar{width:80px;height:8px;border-radius:999px;background:#241505;border:1px solid var(--gold-lo);overflow:hidden}
.xpbar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi));width:75%}

.wallet{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border-radius:999px;
  background:linear-gradient(180deg,#1c1006,#0d0703);
  border:1px solid var(--gold-line);box-shadow:inset 0 1px 0 rgba(255,233,168,.12)}
.pill .ic{font-size:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pill .amt{font-weight:800;font-size:14px;letter-spacing:.4px;min-width:70px;text-align:right}
.pill .plus{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#2a1700;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));border:1px solid var(--gold-lo);font-size:15px;line-height:1;transition:.15s}
.pill .plus:hover{transform:scale(1.12)}

.quick{display:flex;gap:6px}
.qbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 9px;border-radius:12px;transition:.15s;color:var(--gold)}
.qbtn .ic{font-size:21px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.qbtn .lb{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.qbtn:hover{background:var(--gold-soft)}
.dot{position:absolute;top:2px;right:4px;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff6b6b,var(--red));
  color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:1px solid #ffb0b0}

/* ============ FRAME / LAYOUT ============ */
.frame{position:relative;z-index:2;max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:86px 1fr 118px;gap:10px;
  padding:14px clamp(8px,2vw,22px) 108px}
@media(max-width:860px){
  .frame{grid-template-columns:1fr;padding-bottom:96px}
  .frame .rail{flex-direction:row;justify-content:center;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
  .frame .rail::-webkit-scrollbar{display:none}
  .frame .rail .rbtn{min-width:76px;flex:0 0 auto}
}

/* side rails */
.rail{display:flex;flex-direction:column;gap:12px}
.rbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 6px;border-radius:14px;transition:.18s;
  background:linear-gradient(180deg,rgba(30,18,7,.85),rgba(13,7,3,.85));
  border:1px solid rgba(242,193,78,.28);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.rbtn:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 14px rgba(242,193,78,.25)}
.rbtn .ic{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
.rbtn .lb{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);text-align:center;line-height:1.25}
.tag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  font-size:8.5px;font-weight:900;letter-spacing:1px;padding:2px 8px;border-radius:999px;color:#fff;
  background:linear-gradient(180deg,#ff5a5a,var(--red));border:1px solid #ffb0b0;white-space:nowrap;
  animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.12)}}
.bang{position:absolute;top:-6px;right:-5px;width:17px;height:17px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff6b6b,var(--red));color:#fff;font-size:11px;font-weight:900;
  display:grid;place-items:center;border:1px solid #ffb0b0}

/* ============ HERO (center column) ============ */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:6px}
.crown{font-size:clamp(30px,5vw,44px);filter:drop-shadow(0 0 14px rgba(242,193,78,.55));margin-bottom:-14px}
.logo{font-family:"Cinzel",Georgia,serif;font-weight:900;line-height:.95;letter-spacing:3px;
  font-size:clamp(46px,9vw,86px);filter:drop-shadow(0 4px 14px rgba(0,0,0,.8)) drop-shadow(0 0 26px rgba(242,193,78,.28))}
.logo-sub{display:flex;align-items:center;gap:12px;font-family:"Cinzel",serif;font-weight:800;
  letter-spacing:8px;font-size:clamp(15px,3vw,24px);color:var(--gold)}
.logo-sub::before,.logo-sub::after{content:"";height:1px;width:clamp(24px,6vw,70px);
  background:linear-gradient(90deg,transparent,var(--gold));}
.logo-sub::after{background:linear-gradient(90deg,var(--gold),transparent)}
.tagline{font-size:clamp(9px,1.6vw,11.5px);letter-spacing:3.5px;text-transform:uppercase;color:var(--muted);font-weight:700}

/* enter game button */
.enter{position:relative;margin-top:6px;padding:16px clamp(34px,8vw,84px);border-radius:16px;
  font-family:"Cinzel",serif;font-weight:900;font-size:clamp(19px,3.4vw,28px);letter-spacing:4px;color:#fff;
  background:
    linear-gradient(180deg,#8e1023 0%,#5c0713 55%,#7d0c1d 100%);
  border:2px solid var(--gold);
  box-shadow:0 0 0 3px rgba(0,0,0,.55),0 0 0 4px var(--gold-lo),
             0 10px 30px rgba(0,0,0,.65),0 0 34px rgba(242,193,78,.35),
             inset 0 2px 10px rgba(255,150,150,.25);
  text-shadow:0 2px 6px rgba(0,0,0,.7);transition:.18s;overflow:hidden}
.enter::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,240,190,.35) 50%,transparent 70%);
  transform:translateX(-120%);animation:sheen 3.2s ease infinite}
@keyframes sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.enter:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 0 3px rgba(0,0,0,.55),0 0 0 4px var(--gold),
  0 14px 34px rgba(0,0,0,.7),0 0 48px rgba(242,193,78,.5),inset 0 2px 10px rgba(255,150,150,.3)}
.enter:active{transform:scale(.98)}

/* jackpot banner */
.jack{width:min(560px,100%);cursor:pointer;border-radius:16px;padding:14px 18px 16px;position:relative;
  background:linear-gradient(180deg,#241105,#120802);
  border:2px solid var(--gold-line);
  box-shadow:var(--shadow),inset 0 0 30px rgba(242,193,78,.08);transition:.18s}
.jack:hover{border-color:var(--gold);box-shadow:var(--shadow),0 0 26px rgba(242,193,78,.3),inset 0 0 30px rgba(242,193,78,.12)}
.jack .jt{font-family:"Cinzel",serif;font-weight:800;letter-spacing:4px;font-size:clamp(13px,2.4vw,17px);color:var(--gold)}
.jack .jn{font-family:"Rajdhani","Manrope",sans-serif;font-weight:700;letter-spacing:2px;
  font-size:clamp(26px,5.6vw,44px);line-height:1.05;margin-top:2px;
  filter:drop-shadow(0 0 12px rgba(242,193,78,.45))}
.jack .side-coin{position:absolute;font-size:clamp(20px,3.5vw,30px);top:50%;transform:translateY(-50%)}
.jack .side-coin.l{left:12px}.jack .side-coin.r{right:12px}
.jack .gem{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:18px;
  filter:drop-shadow(0 0 8px rgba(255,80,80,.8))}

/* game cards */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;margin-top:4px}
@media(max-width:860px){.cards{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}}
.gcard{position:relative;border-radius:16px;overflow:hidden;padding:0;text-align:center;
  border:2px solid rgba(242,193,78,.4);background:linear-gradient(180deg,#2a1508,#120802);
  box-shadow:0 8px 22px rgba(0,0,0,.55);transition:.2s;display:flex;flex-direction:column}
.gcard:hover{transform:translateY(-6px) scale(1.02);border-color:var(--gold);
  box-shadow:0 14px 30px rgba(0,0,0,.7),0 0 22px rgba(242,193,78,.35)}
.gcard .art{display:grid;place-items:center;height:96px;font-size:46px;position:relative;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.gcard .art::before{content:"";position:absolute;inset:0;
  background:radial-gradient(60% 60% at 50% 35%,rgba(242,193,78,.22),transparent 70%)}
.gcard.hotc .art::before{background:radial-gradient(60% 60% at 50% 35%,rgba(200,16,46,.35),transparent 70%)}
.gcard .plate{margin-top:auto;padding:8px 4px 9px;font-family:"Cinzel",serif;font-weight:800;
  font-size:clamp(11px,1.7vw,14px);letter-spacing:1.5px;color:var(--gold);
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.75));border-top:1px solid rgba(242,193,78,.35)}
.gcard .hot{position:absolute;top:6px;left:6px;font-size:8.5px;font-weight:900;letter-spacing:1px;
  padding:2px 7px;border-radius:999px;color:#fff;background:linear-gradient(180deg,#ff5a5a,var(--red));border:1px solid #ffb0b0}

.demonote{margin-top:10px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
  border:1px solid rgba(242,193,78,.25);border-radius:999px;padding:6px 16px;background:rgba(0,0,0,.35)}

/* ============ BOTTOM NAV ============ */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:center;gap:clamp(2px,2vw,26px);align-items:flex-end;
  padding:6px clamp(6px,2vw,20px) calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(12,6,2,.86),rgba(7,3,1,.98));
  border-top:1px solid var(--gold-line);backdrop-filter:blur(10px)}
.nbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;
  transition:.15s;min-width:58px}
.nbtn .ic{font-size:23px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
.nbtn .lb{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.nbtn.on .lb,.nbtn:hover .lb{color:var(--gold)}
.nbtn.on{background:var(--gold-soft);box-shadow:inset 0 0 0 1px rgba(242,193,78,.35)}
.nbtn.vip{margin-top:-26px}
.nbtn.vip .ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 30%,#40130a,#1b0602 70%);
  border:3px solid var(--gold);box-shadow:0 0 0 3px #2a1200,0 6px 18px rgba(0,0,0,.7),0 0 22px rgba(242,193,78,.45);
  font-size:26px;transition:.18s}
.nbtn.vip:hover .ring{transform:scale(1.07);box-shadow:0 0 0 3px #2a1200,0 8px 20px rgba(0,0,0,.8),0 0 32px rgba(242,193,78,.6)}
.nbtn.vip .lb{color:var(--gold);font-family:"Cinzel",serif;font-size:11px;letter-spacing:2px}

/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;
  background:rgba(4,2,1,.78);backdrop-filter:blur(6px)}
.overlay.on{display:grid}
.sheet{width:min(680px,100%);max-height:min(86vh,780px);display:flex;flex-direction:column;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--gold-line);box-shadow:0 24px 70px rgba(0,0,0,.8),0 0 40px rgba(242,193,78,.15);
  animation:pop .25s ease}
@keyframes pop{from{transform:translateY(22px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 18px;
  background:linear-gradient(180deg,rgba(242,193,78,.14),transparent);
  border-bottom:1px solid rgba(242,193,78,.3)}
.sheet-head h2{margin:0;font-family:"Cinzel",serif;font-size:19px;letter-spacing:2px;color:var(--gold);font-weight:800;flex:1}
.xbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:900;
  color:var(--gold);border:1px solid var(--gold-line);transition:.15s}
.xbtn:hover{background:var(--gold-soft);transform:rotate(90deg)}
.sheet-body{padding:18px;overflow-y:auto;overscroll-behavior:contain}

/* generic bits inside panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border-radius:12px;padding:14px;text-align:center;border:1px solid rgba(242,193,78,.3);
  background:linear-gradient(180deg,#201005,#0f0703);transition:.15s;display:flex;flex-direction:column;gap:6px;align-items:center}
button.tile:hover{border-color:var(--gold);transform:translateY(-3px)}
.tile .big{font-size:32px}
.tile b{font-family:"Cinzel",serif;letter-spacing:1px;color:var(--gold);font-size:13px}
.tile small{color:var(--muted);font-size:11px;line-height:1.4}
.gbtn{padding:11px 22px;border-radius:11px;font-weight:800;letter-spacing:1px;font-size:14px;color:#2a1700;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#c98f1e);
  border:1px solid var(--gold-lo);box-shadow:0 4px 14px rgba(242,193,78,.3);transition:.15s}
.gbtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.gbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.gbtn.red{color:#fff;background:linear-gradient(180deg,#e04a5e,var(--red) 55%,var(--red-deep));border-color:#7d0c1d;
  box-shadow:0 4px 14px rgba(200,16,46,.35)}
.gbtn.ghost{color:var(--gold);background:transparent;border:1px solid var(--gold-line);box-shadow:none}
.gbtn.wide{width:100%}
.listrow{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid rgba(242,193,78,.14)}
.listrow:last-child{border-bottom:none}
.listrow .ic{font-size:24px}
.listrow .tx{flex:1;min-width:0}
.listrow .tx b{display:block;font-size:14px}
.listrow .tx small{color:var(--muted);font-size:11.5px}
.note{font-size:12px;color:var(--muted);line-height:1.55;border:1px dashed rgba(242,193,78,.35);
  border-radius:10px;padding:10px 12px;margin-top:14px}
.center{text-align:center}
.betbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.betchip{padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;border:1px solid var(--gold-line);color:var(--cream);transition:.15s}
.betchip.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1700;border-color:var(--gold-lo)}
.result{min-height:24px;text-align:center;font-weight:800;font-size:15px;margin-top:10px}
.result.win{color:var(--win)}.result.lose{color:#ff8a8a}

/* slots */
.reels{display:flex;gap:10px;justify-content:center;margin:8px 0 4px}
.reel{width:84px;height:96px;border-radius:12px;display:grid;place-items:center;font-size:48px;overflow:hidden;
  background:linear-gradient(180deg,#000,#1c0f05 50%,#000);border:2px solid var(--gold-lo);
  box-shadow:inset 0 6px 14px rgba(0,0,0,.8),0 0 12px rgba(242,193,78,.15)}
.reel.rolling span{animation:roll .35s linear infinite}
@keyframes roll{0%{transform:translateY(-34px);opacity:.2}50%{opacity:1}100%{transform:translateY(34px);opacity:.2}}

/* cards (baccarat) */
.bhand{display:flex;gap:8px;justify-content:center;min-height:92px;flex-wrap:wrap}
.pcard{width:60px;height:86px;border-radius:8px;background:linear-gradient(180deg,#fdf8ea,#e9dfc6);color:#161616;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;
  box-shadow:0 4px 10px rgba(0,0,0,.5);animation:deal .3s ease}
.pcard.redc{color:#c0392b}
@keyframes deal{from{transform:translateY(-14px) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
.bacc-opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bacc-opts .betchip.on{box-shadow:0 0 14px rgba(242,193,78,.4)}
.handlbl{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);text-align:center;margin:10px 0 6px;font-weight:800}
.handlbl b{color:var(--gold);margin-left:6px}

/* wheel */
.wheelbox{display:grid;place-items:center;margin:6px 0 14px;position:relative}
.wheel{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;position:relative;
  border:6px solid var(--gold);box-shadow:0 0 0 4px #2a1200,0 10px 30px rgba(0,0,0,.7),0 0 30px rgba(242,193,78,.35);
  background:conic-gradient(
    #7d0c1d 0 45deg,#241105 45deg 90deg,#a3131f 90deg 135deg,#1c1006 135deg 180deg,
    #7d0c1d 180deg 225deg,#241105 225deg 270deg,#a3131f 270deg 315deg,#1c1006 315deg 360deg);
  transition:transform 3.4s cubic-bezier(.15,.85,.25,1)}
.wheel span{position:absolute;left:50%;top:50%;font-weight:800;font-size:14px;color:var(--gold-hi);
  transform-origin:0 0;text-shadow:0 1px 3px #000}
.wheel-pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:2;font-size:26px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
.wheel-hub{position:absolute;width:56px;height:56px;border-radius:50%;z-index:2;display:grid;place-items:center;font-size:24px;
  background:radial-gradient(circle at 38% 30%,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  border:3px solid #2a1200;box-shadow:0 4px 12px rgba(0,0,0,.6)}

/* fishing */

/* ranking */

.rankrow .pos{width:30px;text-align:center;font-family:"Cinzel",serif;font-weight:900;font-size:16px;color:var(--gold)}

/* toast */
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:80;
  background:linear-gradient(180deg,#241105,#120802);border:1px solid var(--gold);color:var(--cream);
  padding:11px 22px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);
  transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script>
/* =====================================================================
   ROYAL CLUB — demo lobby. Virtual coins only, nothing real is wagered.
===================================================================== */
'use strict';

/* ---------- state ---------- */
const ADMIN_DEFAULTS = {
  slotBets:[100,500,1000,5000], baccBets:[100,500,1000,5000], sportBets:[100,500,1000,5000],
  slotPay:{'👑':100,'💎':60,'7️⃣':40,'⭐':20,'🔔':15},
  slotWeights:{'🍒':18,'🍋':18,'🔔':15,'⭐':13,'7️⃣':11,'💎':8,'🍉':12,'👑':5},
  baccarat:{player:1,banker:.95,tie:8},
  wheelPrizes:[5000,500,10000,1000,25000,2000,88888,100],
  dailyRewards:[5000,8000,12000,20000,30000,50000,100000]
};
function loadAdminConfig(){
  try{ const d=JSON.parse(localStorage.getItem('royalClubAdminConfig')||'null'); if(d) return Object.assign({},ADMIN_DEFAULTS,d); }catch(e){}
  return JSON.parse(JSON.stringify(ADMIN_DEFAULTS));
}
const CFG=loadAdminConfig();
const DEFAULTS = { coins: 500000, gems: 999, vip: 9, xp: 75, lastDaily: '', lastWheel: '', mailRead: [], sound: true };
let S = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem('royalClubDemo') || 'null'); if(d) return Object.assign({}, DEFAULTS, d); }catch(e){}
  return Object.assign({}, DEFAULTS);
}
function save(){ try{ localStorage.setItem('royalClubDemo', JSON.stringify(S)); }catch(e){} }

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
function setCoins(v, animate){
  const el = $('coins'); const from = S.coins; S.coins = Math.max(0, v); save();
  if(!animate){ el.textContent = fmt(S.coins); return; }
  const t0 = performance.now(), dur = 600;
  (function tick(t){ const p = Math.min(1,(t-t0)/dur);
    el.textContent = fmt(from + (S.coins-from)*p);
    if(p<1) requestAnimationFrame(tick); })(t0);
}
function addCoins(n){ setCoins(S.coins + n, true); }
function spend(n){ if(S.coins < n){ toast('Not enough coins — grab some in Free Coins! 💰'); return false; } setCoins(S.coins - n); return true; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }
function beep(freq, dur){
  if(!S.sound) return;
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq||880; o.type='triangle';
    g.gain.setValueAtTime(.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + (dur||.15));
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (dur||.15));
  }catch(e){}
}
const today = () => new Date().toISOString().slice(0,10);

/* ---------- gold dust ---------- */
(function(){
  const box = $('dust');
  for(let i=0;i<26;i++){
    const p = document.createElement('i');
    p.style.left = (Math.random()*100)+'%';
    p.style.animationDuration = (7+Math.random()*9)+'s';
    p.style.animationDelay = (Math.random()*10)+'s';
    p.style.width = p.style.height = (2+Math.random()*4)+'px';
    box.appendChild(p);
  }
})();

/* ---------- jackpot ticker ---------- */
let JACK = 88888888888;
setInterval(()=>{ JACK += Math.floor(500 + Math.random()*8000); $('jackpotNum').textContent = fmt(JACK); }, 900);

/* ---------- modal engine ---------- */
let onPanelClose = null;
function openPanel(id){
  const p = PANELS[id]; if(!p) return;
  if(onPanelClose){ onPanelClose(); onPanelClose = null; }
  $('sheetTitle').textContent = p.title;
  $('sheetBody').innerHTML = p.html();
  $('overlay').classList.add('on');
  document.body.style.overflow = 'hidden';
  if(p.init) p.init();
}
function closePanel(){
  if(onPanelClose){ onPanelClose(); onPanelClose = null; }
  $('overlay').classList.remove('on');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });
function navTo(id){
  document.querySelectorAll('#bnav .nbtn').forEach(b=>b.classList.toggle('on', b.dataset.nav===id));
  if(id==='home'){ closePanel(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  openPanel(id);
}
function openGame(id){ openPanel(id); }

/* =====================================================================
   PANELS
===================================================================== */
const PANELS = {};

/* ---------- GAMES HUB ---------- */
PANELS.games = {
  title: '🃏 GAME LOBBY',
  html: () => `
    <div class="grid2">
      <button class="tile" onclick="openGame('slots')"><span class="big">🎰</span><b>ROYAL SLOTS</b><small>3-reel classic · jackpot 100×</small></button>
      <button class="tile" onclick="openGame('live')"><span class="big">🃏</span><b>LIVE GAMES</b><small>Table lounge · pick a seat</small></button>
      <button class="tile" onclick="openGame('baccarat')"><span class="big">🂡</span><b>BACCARAT</b><small>Player · Banker · Tie</small></button>
      <button class="tile" onclick="openGame('fishing')"><span class="big">🦈</span><b>GOLD FISHING</b><small>Catch fish, win coins</small></button>
      <button class="tile" onclick="openGame('sports')"><span class="big">⚽</span><b>SPORTS ARENA</b><small>Pick winners · demo odds</small></button>
      <button class="tile" onclick="openGame('wheel')"><span class="big">🎡</span><b>LUCKY WHEEL</b><small>Free daily spin</small></button>
    </div>
    <div class="note">All games use virtual coins for entertainment only. Results are random — no real money is ever involved.</div>`
};

/* ---------- SLOTS ---------- */
const SLOT_SYM = ['🍒','🍋','🔔','⭐','7️⃣','💎','🍉','👑'];
const SLOT_PAY = CFG.slotPay;
let slotBet = 100;
PANELS.slots = {
  title: '🎰 ROYAL SLOTS',
  html: () => `
    <div class="reels">
      <div class="reel" id="sl0"><span>👑</span></div>
      <div class="reel" id="sl1"><span>7️⃣</span></div>
      <div class="reel" id="sl2"><span>💎</span></div>
    </div>
    <div class="betbar" id="slotBets"></div>
    <button class="gbtn red wide" id="slotGo" onclick="slotSpin()" style="font-family:'Cinzel',serif;letter-spacing:3px;font-size:17px">SPIN</button>
    <div class="result" id="slotRes"></div>
    <div class="note">Three of a kind pays 10×–100× your bet · any pair pays 2× · 👑👑👑 hits the 100× royal jackpot.</div>`,
  init: () => betBar('slotBets', v=>slotBet=v, ()=>slotBet, CFG.slotBets)
};
function betBar(id, set, get, values){
  const box = $(id); box.innerHTML='';
  (values||[100,500,1000,5000]).forEach(v=>{
    const b = document.createElement('button');
    b.className = 'betchip' + (get()===v?' on':'');
    b.textContent = '🪙 ' + fmt(v);
    b.onclick = ()=>{ set(v); box.querySelectorAll('.betchip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    box.appendChild(b);
  });
}
function slotSpin(){
  if(!spend(slotBet)) return;
  beep(520,.1);
  const reels = [0,1,2].map(i=>$('sl'+i));
  const weightedSymbol=()=>{ const total=SLOT_SYM.reduce((n,s)=>n+(Number(CFG.slotWeights[s])||1),0); let roll=Math.random()*total; for(const s of SLOT_SYM){roll-=Number(CFG.slotWeights[s])||1;if(roll<=0)return s;} return SLOT_SYM[0]; };
  const res = [0,1,2].map(weightedSymbol);
  $('slotGo').disabled = true; $('slotRes').textContent='';
  reels.forEach(r=>r.classList.add('rolling'));
  let done = 0;
  reels.forEach((r,i)=>setTimeout(()=>{
    r.classList.remove('rolling'); r.querySelector('span').textContent = res[i]; beep(700+i*120,.08);
    if(++done===3) slotSettle(res);
  }, 500 + i*350));
}
function slotSettle(res){
  $('slotGo').disabled = false;
  let mult = 0;
  if(res[0]===res[1] && res[1]===res[2]) mult = SLOT_PAY[res[0]] || 10;
  else if(res[0]===res[1] || res[1]===res[2] || res[0]===res[2]) mult = 2;
  const el = $('slotRes');
  if(mult){
    const win = slotBet*mult; addCoins(win); beep(1200,.3);
    el.className='result win'; el.textContent = `${res.join(' ')}  ·  ${mult}× WIN  +${fmt(win)} 🪙`;
    if(mult>=100) toast('👑 ROYAL JACKPOT!!! 👑');
  } else {
    el.className='result lose'; el.textContent = `${res.join(' ')}  ·  so close! try again`;
  }
}

/* ---------- LIVE LOUNGE ---------- */
PANELS.live = {
  title: '🃏 LIVE LOUNGE',
  html: () => `
    <div class="grid2">
      <button class="tile" onclick="openGame('baccarat')"><span class="big">🂡</span><b>BACCARAT · TABLE 1</b><small>Dealer Rose · 12 seated</small></button>
      <button class="tile" onclick="openGame('baccarat')"><span class="big">🂱</span><b>BACCARAT · VIP</b><small>Dealer Lily · 3 seated</small></button>
      <button class="tile" onclick="toast('This table opens in a future update 🛠️')"><span class="big">🎡</span><b>ROULETTE</b><small>Coming soon</small></button>
      <button class="tile" onclick="toast('This table opens in a future update 🛠️')"><span class="big">🎲</span><b>SIC BO</b><small>Coming soon</small></button>
    </div>
    <div class="note">Live tables are simulated for the demo — the dealer is a friendly random number generator in a bow tie.</div>`
};

/* ---------- BACCARAT ---------- */
let baccBet = 100, baccPick = 'player', baccBusy = false;
PANELS.baccarat = {
  title: '🂡 BACCARAT ROYALE',
  html: () => `
    <div class="handlbl">BANKER <b id="bScore"></b></div>
    <div class="bhand" id="bHand"></div>
    <div class="handlbl">PLAYER <b id="pScore"></b></div>
    <div class="bhand" id="pHand"></div>
    <div class="bacc-opts" id="baccOpts">
      <button class="betchip" data-p="player">PLAYER ${CFG.baccarat.player}:1</button>
      <button class="betchip" data-p="banker">BANKER ${CFG.baccarat.banker}:1</button>
      <button class="betchip" data-p="tie">TIE ${CFG.baccarat.tie}:1</button>
    </div>
    <div class="betbar" id="baccBets"></div>
    <button class="gbtn red wide" id="baccGo" onclick="baccDeal()" style="font-family:'Cinzel',serif;letter-spacing:3px;font-size:16px">DEAL</button>
    <div class="result" id="baccRes"></div>
    <div class="note">Simplified baccarat demo: closest hand to 9 wins. Tens and face cards count as zero.</div>`,
  init: () => {
    betBar('baccBets', v=>baccBet=v, ()=>baccBet, CFG.baccBets);
    baccBusy = false;
    document.querySelectorAll('#baccOpts .betchip').forEach(b=>{
      b.classList.toggle('on', b.dataset.p===baccPick);
      b.onclick = ()=>{ baccPick = b.dataset.p;
        document.querySelectorAll('#baccOpts .betchip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    });
  }
};
function baccCard(){
  const r = 1 + Math.floor(Math.random()*13);
  const suits = ['♠','♥','♦','♣']; const s = suits[Math.floor(Math.random()*4)];
  const face = r===1?'A':r===11?'J':r===12?'Q':r===13?'K':r;
  return { v: r>=10?0:r, txt: face+s, red: s==='♥'||s==='♦' };
}
const baccVal = h => h.reduce((t,c)=>t+c.v,0) % 10;
function baccRender(id, hand){
  $(id).innerHTML = hand.map(c=>`<div class="pcard${c.red?' redc':''}">${c.txt}</div>`).join('');
}
function baccDeal(){
  if(baccBusy) return;
  if(!spend(baccBet)) return;
  baccBusy = true; $('baccGo').disabled = true; $('baccRes').textContent='';
  const P = [baccCard(), baccCard()], B = [baccCard(), baccCard()];
  // simplified third-card: draw on 0-5 unless either side has a natural 8/9
  const natural = baccVal(P)>=8 || baccVal(B)>=8;
  if(!natural && baccVal(P)<=5) P.push(baccCard());
  if(!natural && baccVal(B)<=5) B.push(baccCard());
  $('pHand').innerHTML = ''; $('bHand').innerHTML = '';
  $('pScore').textContent=''; $('bScore').textContent='';
  let step = 0;
  const seq = [
    ()=>{ baccRender('pHand', P.slice(0,2)); beep(600,.08); },
    ()=>{ baccRender('bHand', B.slice(0,2)); beep(600,.08); },
    ()=>{ baccRender('pHand', P); baccRender('bHand', B); $('pScore').textContent=baccVal(P); $('bScore').textContent=baccVal(B); beep(760,.08); },
    ()=>baccSettle(baccVal(P), baccVal(B))
  ];
  const t = setInterval(()=>{ seq[step++](); if(step>=seq.length) clearInterval(t); }, 550);
}
function baccSettle(p, b){
  const winner = p===b?'tie':(p>b?'player':'banker');
  const el = $('baccRes');
  if(winner === baccPick){
    const mult = Number(CFG.baccarat[winner]);
    const win = Math.round(baccBet*(1+mult)); addCoins(win); beep(1200,.3);
    el.className='result win';
    el.textContent = `${winner.toUpperCase()} wins ${p} vs ${b} · +${fmt(win-baccBet)} 🪙`;
  } else {
    el.className='result lose';
    el.textContent = `${winner.toUpperCase()} wins ${p} vs ${b} · better luck next hand`;
  }
  baccBusy = false; $('baccGo').disabled = false;
}

/* ---------- FISHING ---------- */
const FISH = [
  {e:'🐠', v:20,  spd:9},
  {e:'🐟', v:30,  spd:8},
  {e:'🐡', v:60,  spd:7},
  {e:'🦑', v:100, spd:6},
  {e:'🦈', v:300, spd:5},
  {e:'🐋', v:800, spd:11}

const MATCHES = [
  { a:['🦁','Lions'],   b:['🦅','Eagles'],  oa:1.8, ob:2.1 },
  { a:['🐉','Dragons'], b:['🐺','Wolves'],  oa:2.4, ob:1.6 },

let sportPicks = {};
PANELS.sports = {
  title: '⚽ SPORTS ARENA',
  html: () => `
    <div id="matchList">${MATCHES.map((m,i)=>`
      <div class="match">
        <div class="team"><span class="fl">${m.a[0]}</span><span>${m.a[1]}</span>
          <button data-m="${i}" data-s="a" onclick="sportPick(this)">win ×${m.oa}</button></div>
        <div class="vs">VS</div>
        <div class="team"><span class="fl">${m.b[0]}</span><span>${m.b[1]}</span>
          <button data-m="${i}" data-s="b" onclick="sportPick(this)">win ×${m.ob}</button></div>
      </div>`).join('')}
    </div>
    <div class="betbar" id="sportBets"></div>
    <button class="gbtn red wide" onclick="sportPlay()" style="font-family:'Cinzel',serif;letter-spacing:3px">KICK OFF</button>
    <div class="result" id="sportRes"></div>
    <div class="note">Pick a winner in one or more matches, then Kick Off. Each pick stakes your bet at the shown multiplier. Pure luck, pure demo.</div>`,
  init: () => { sportPicks = {}; betBar('sportBets', v=>sportBet=v, ()=>sportBet, CFG.sportBets); }
};
let sportBet = 100;
function sportPick(btn){
  const m = btn.dataset.m;
  const same = sportPicks[m]===btn.dataset.s;
  document.querySelectorAll(`#matchList button[data-m="${m}"]`).forEach(x=>x.classList.remove('on'));
  if(same){ delete sportPicks[m]; } else { sportPicks[m]=btn.dataset.s; btn.classList.add('on'); }
}
function sportPlay(){
  const picks = Object.entries(sportPicks);
  if(!picks.length){ toast('Pick at least one team first! ⚽'); return; }
  const cost = sportBet * picks.length;
  if(!spend(cost)) return;
  beep(500,.12);
  let winTotal = 0, lines = [];
  picks.forEach(([mi, side])=>{
    const m = MATCHES[mi];
    const pa = m.ob/(m.oa+m.ob);           // implied prob favors lower multiplier
    const winner = Math.random() < pa ? 'a' : 'b';
    const name = winner==='a'?m.a[1]:m.b[1];
    if(winner===side){ const w = Math.round(sportBet * (winner==='a'?m.oa:m.ob)); winTotal += w; lines.push(`✅ ${name} won (+${fmt(w)})`); }
    else lines.push(`❌ ${name} won`);
  });
  if(winTotal) { addCoins(winTotal); beep(1200,.3); }
  const el = $('sportRes');
  el.className = 'result ' + (winTotal>=cost?'win':'lose');
  el.textContent = lines.join('  ·  ') + `  ·  net ${winTotal-cost>=0?'+':''}${fmt(winTotal-cost)} 🪙`;
}

function wheelSpin(){

  wheelSpinning = true; $('wheelRes').textContent=''; beep(440,.15);

  const target = 360*4 + (360 - (idx*45 + 22.5));

  const disc = $('wheelDisc');
  disc.style.transition='transform 3.4s cubic-bezier(.15,.85,.25,1)';
  disc.style.transform = `rotate(${wheelAngle}deg)`;
